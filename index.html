<!DOCTYPE html>
<html dir="rtl" lang="ar" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7367f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="icons/site.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<title>القاعدة المدنية - تعليم القراءة</title>
<style>
/* ===== 1. ROOT VARIABLES (HaramApp Identity) ===== */
:root {
  --primary: #7367f0;
  --primary-rgb: 115, 103, 240;
  --secondary: #808390;
  --success: #28c76f;
  --info: #00bad1;
  --warning: #ff9f43;
  --danger: #ff4c51;
  --gold: #c7a76c;
  --green-dark: #3c6f5e;
  --light: #dfdfe3;
  --dark: #2f3349;
  --paper-bg: #ffffff;
  --body-bg: #fafafa;
  --body-color: #6d6b77;
  --heading-color: #444050;
  --border-color: #e6e6e8;
  --gray-50: #f3f2f3;
  --gray-100: #eaeaec;
  --gray-200: #e6e6e8;
  --gray-300: #c1bfc5;
  --gray-400: #acaab1;
  --gray-500: #97959e;
  --gray-600: #82808b;
  --gray-700: #6d6b77;
  --gray-800: #595564;
  --gray-900: #444050;
  --box-shadow: 0 0.1875rem 0.75rem 0 rgba(47,43,61,0.14);
  --box-shadow-sm: 0 0.125rem 0.5rem 0 rgba(47,43,61,0.12);
  --box-shadow-lg: 0 0.25rem 1.125rem 0 rgba(47,43,61,0.16);
  --radius: 1.25rem;
  --radius-sm: 0.75rem;
  --radius-xs: 0.5rem;
  --font: 'Almarai', 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-quran: 'uthmanic', 'Almarai', serif;
  --header-bg: #ffffff;
  --card-bg: #ffffff;
  --overlay: rgba(47,43,61,.6);
  --menu-bg: rgba(255,255,255,.95);
  --btn-text: #ffffff;
}

[data-theme="dark"] {
  --primary: #7367f0;
  --secondary: #808390;
  --success: #28c76f;
  --info: #00bad1;
  --warning: #ff9f43;
  --danger: #ff4c51;
  --gold: #b39363;
  --paper-bg: #0f1115;
  --body-bg: #090a0d;
  --body-color: #acabc1;
  --heading-color: #cfcde4;
  --border-color: #1d2127;
  --gray-50: #272a3a;
  --gray-100: #2e3142;
  --gray-200: #34384a;
  --gray-300: #3d4154;
  --gray-400: #1d2127;
  --gray-500: #64667d;
  --gray-600: #76778e;
  --gray-700: #9293ae;
  --gray-800: #9a9ab0;
  --gray-900: #acabc1;
  --box-shadow: 0 0.1875rem 0.75rem 0 rgba(19,17,32,0.2);
  --box-shadow-sm: 0 0.125rem 0.5rem 0 rgba(19,17,32,0.16);
  --box-shadow-lg: 0 0.25rem 1.125rem 0 rgba(19,17,32,0.22);
  --header-bg: #0f1115;
  --card-bg: #17181e;
  --overlay: rgba(0,0,0,.7);
  --menu-bg: rgba(15,17,21,.95);
  --btn-text: #ffffff;
}

/* ===== 2. FONT FACE ===== */
@font-face {
  font-family: 'uthmanic';
  src: url('uthmanic.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

/* ===== 3. RESET ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--body-bg);color:var(--body-color);min-height:100dvh;direction:rtl;transition:background .3s,color .3s}

/* ===== 4. APP SHELL ===== */
#app{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--body-bg);transition:background .3s}
.screen.active{display:flex}

/* ===== 5. HEADER ===== */
.header{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--header-bg);border-bottom:1px solid var(--border-color);min-height:60px;transition:background .3s,border-color .3s}
.header-start,.header-end{display:flex;align-items:center;gap:8px}
.header-title{font-family:var(--font);font-size:1rem;font-weight:700;color:var(--heading-color)}
.header-btn{width:40px;height:40px;border:none;border-radius:var(--radius-xs);background:transparent;color:var(--heading-color);font-size:1.3em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.header-btn:active{background:var(--gray-100);transform:scale(.92)}

/* ===== 6. THEME TOGGLE ===== */
.theme-btn{width:40px;height:40px;border:none;border-radius:var(--radius-xs);background:var(--gray-50);color:var(--heading-color);font-size:1.1em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.theme-btn:active{transform:scale(.88)}

/* ===== 7. SCROLL BODY ===== */
.scroll-body{flex:1;overflow-y:auto;padding:76px 20px 24px;width:100%;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.scroll-body::-webkit-scrollbar{width:4px}
.scroll-body::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:10px}

/* ===== 8. LOGO ===== */
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
.logo-icon{width:48px;height:48px;border-radius:var(--radius-xs)}
.logo-text{font-family:var(--font);font-size:1.8rem;font-weight:800;color:var(--heading-color);letter-spacing:-.5px}
.logo-sub{font-size:.8rem;color:var(--gray-500);font-weight:400;margin-top:-4px}

/* ===== 9. BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-xs);font-family:var(--font);font-size:1rem;font-weight:500;cursor:pointer;transition:all .12s;box-shadow:var(--box-shadow-sm);padding:12px 32px;min-height:50px;line-height:1}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-green{background:var(--green-dark);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border-color);color:var(--heading-color);box-shadow:none}
.btn-ghost{background:var(--gray-50);color:var(--heading-color);box-shadow:none}
.btn-block{width:100%;padding:14px;border-radius:var(--radius-sm);font-size:1.1rem}
.btn-sm{padding:8px 18px;min-height:38px;font-size:.85rem;border-radius:var(--radius-xs)}
.btn-circle{width:50px;height:50px;border-radius:50%;padding:0;min-height:auto}

/* ===== 10. CARDS ===== */
.card{background:var(--card-bg);border-radius:var(--radius-sm);padding:24px;box-shadow:var(--box-shadow);border:none;width:100%;transition:background .3s}
.card-glass{background:rgba(255,255,255,.12);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:20px;width:100%;color:#fff}

/* ===== 11. BADGES ===== */
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:.6rem;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.badge-primary{background:rgba(115,103,240,.12);color:var(--primary)}
.badge-success{background:rgba(40,199,111,.12);color:var(--success)}
.badge-warning{background:rgba(255,159,67,.12);color:var(--warning)}
.badge-danger{background:rgba(255,76,81,.12);color:var(--danger)}
.badge-info{background:rgba(0,186,209,.12);color:var(--info)}
.badge-gold{background:rgba(199,167,108,.12);color:var(--gold)}
.badge-green{background:rgba(60,111,94,.12);color:var(--green-dark)}

/* ===== 12. WORD DISPLAY ===== */
.word-box{background:var(--card-bg);border-radius:var(--radius);padding:28px 36px;box-shadow:var(--box-shadow);text-align:center;display:flex;align-items:center;justify-content:center;min-height:110px;min-width:140px;transition:all .3s;border:1px solid var(--border-color)}
.word-box.big{font-size:4.5rem;min-height:170px;font-family:var(--font-quran)}
.word-box.med{font-size:2.8rem;min-height:95px;font-family:var(--font-quran)}
.word-box.small{font-size:1.6rem;min-height:65px;padding:14px 20px}
.word-box.pop{animation:popIn .35s ease}
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* ===== 13. OPTIONS ===== */
.opt-grid{display:grid;gap:10px;width:100%}
.opt-2{grid-template-columns:repeat(2,1fr)}
.opt-3{grid-template-columns:repeat(3,1fr)}
.opt-4{grid-template-columns:repeat(4,1fr)}
.opt-btn{display:flex;align-items:center;justify-content:center;padding:18px;border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:2rem;font-family:var(--font-quran);cursor:pointer;transition:all .1s;background:var(--card-bg);box-shadow:var(--box-shadow-sm);font-weight:700;color:var(--heading-color);min-height:68px}
.opt-btn:active{transform:scale(.92)}
.opt-btn.correct{background:var(--success)!important;color:#fff;border-color:var(--success);animation:pulse .4s}
.opt-btn.wrong{background:var(--danger)!important;color:#fff;border-color:var(--danger)}
@keyframes pulse{0%{transform:scale(1)}33%{transform:scale(1.08)}66%{transform:scale(.96)}100%{transform:scale(1)}}

/* ===== 14. PROGRESS ===== */
.progress-wrap{width:100%;display:flex;align-items:center;gap:10px;margin:4px 0}
.progress-track{flex:1;height:6px;background:var(--gray-100);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:10px;transition:width .5s ease}
.progress-num{color:var(--gray-600);font-size:.75rem;font-weight:600;min-width:28px;text-align:center}

/* ===== 15. CELEBRATION ===== */
.celebrate-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:var(--overlay);backdrop-filter:blur(8px)}
.celebrate-overlay.show{display:flex}
.celebrate-box{background:var(--card-bg);border-radius:var(--radius);padding:32px 28px;text-align:center;max-width:360px;width:90%;animation:bounceIn .4s ease;border:1px solid var(--border-color);box-shadow:var(--box-shadow-lg)}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.celebrate-box .stars{font-size:3.2rem;margin:8px 0}
.celebrate-box h2{font-family:var(--font);font-size:1.5rem;font-weight:700;color:var(--heading-color);margin:8px 0}
.celebrate-box p{color:var(--body-color);font-size:.95rem;margin:8px 0}

/* ===== 16. MENU GRID ===== */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px;margin:4px 0}
.menu-card{background:var(--card-bg);border-radius:var(--radius-sm);padding:16px 12px;text-align:center;cursor:pointer;transition:all .12s;box-shadow:var(--box-shadow-sm);border:1px solid var(--border-color)}
.menu-card:active{transform:scale(.95);border-color:var(--primary)}
.menu-card .micon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;font-size:1.2rem;font-weight:800;margin-bottom:6px;box-shadow:0 3px 8px rgba(var(--primary-rgb),.25)}
.menu-card .mname{font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--heading-color)}
.menu-card .mdesc{font-size:.65rem;color:var(--gray-400);margin-top:1px}
.menu-card .mbadges{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:5px}

/* ===== 17. STEPS (VAKT) ===== */
.steps{display:flex;gap:5px;justify-content:center;margin:8px 0}
.step{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;background:var(--gray-100);color:var(--gray-600);transition:all .3s;border:2px solid transparent}
.step.done{background:var(--success);color:#fff;border-color:var(--success)}
.step.curr{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.12)}

/* ===== 18. ZPD LEVELS ===== */
.zpd-dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.zpd-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;background:var(--gray-50);color:var(--gray-500);border:2px solid var(--border-color);transition:all .3s}
.zpd-dot.done{background:var(--success);color:#fff;border-color:var(--success)}
.zpd-dot.curr{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.15)}

/* ===== 19. TRACING CANVAS ===== */
#traceCanvas{width:100%;max-width:480px;height:240px;border-radius:var(--radius-sm);touch-action:none;cursor:crosshair;display:block;margin:8px auto;background:var(--gray-50);border:2px solid var(--border-color);box-shadow:inset 0 2px 12px rgba(0,0,0,.06)}

/* ===== 20. SAND TRAY ===== */
.sand-box{position:relative;width:100%;max-width:360px;margin:8px auto}
.sand-letter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:5.5rem;font-weight:700;color:rgba(0,0,0,.04);pointer-events:none;z-index:0;font-family:var(--font-quran)}

/* ===== 21. SPARKLE ===== */
.sparkle{position:fixed;pointer-events:none;z-index:999}
.spark{position:absolute;border-radius:50%;animation:sparkOut .7s ease forwards}
@keyframes sparkOut{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* ===== 22. SYLLABLE CLAP ===== */
.clap-btn{width:60px;height:60px;border-radius:50%;background:var(--card-bg);border:2px solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-family:var(--font);font-weight:700;cursor:pointer;transition:all .1s;color:var(--heading-color);box-shadow:var(--box-shadow-sm)}
.clap-btn:active{transform:scale(.88);background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== 23. BROWSE BOOK ===== */
.page-img{width:100%;border-radius:var(--radius-sm);margin-bottom:10px;max-height:380px;object-fit:contain;cursor:pointer;transition:all .3s;border:1px solid var(--border-color);background:var(--gray-50)}
.barcode-bar{display:inline-block;width:28px;height:28px;background:repeating-linear-gradient(90deg,var(--heading-color),var(--heading-color) 2px,transparent 2px,transparent 4px);border-radius:2px;vertical-align:middle}

/* ===== 24. THEORY LABELS ===== */
.theory-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}

/* ===== 25. RESPONSIVE ===== */
@media(max-width:420px){
  .menu-grid{gap:8px}
  .menu-card{padding:12px 8px}
  .menu-card .micon{width:38px;height:38px;font-size:1rem}
  .menu-card .mname{font-size:.78rem}
  .word-box.big{font-size:3.2rem;min-height:130px}
  .word-box.med{font-size:2rem;min-height:75px}
  .opt-btn{font-size:1.4rem;padding:14px;min-height:56px}
  .btn{font-size:.9rem;padding:10px 22px;min-height:42px}
  .header-title{font-size:.85rem}
  .logo-text{font-size:1.4rem}
}

/* ===== 26. PAGE NAV ===== */
.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-bottom:6px;flex-wrap:wrap}
.nav-bar .nav-btn{width:36px;height:36px;border:none;border-radius:var(--radius-xs);background:var(--gray-50);color:var(--heading-color);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-bar .nav-btn:active{transform:scale(.88);background:var(--gray-200)}
.nav-bar .nav-label{font-size:.85rem;font-weight:600;color:var(--heading-color)}

/* ===== 27. IDEA TABS ===== */
.idea-tabs{display:flex;gap:4px;background:var(--gray-50);border-radius:var(--radius-xs);padding:3px;margin:6px 0;width:100%;max-width:340px;direction:ltr}
.idea-tab{flex:1;text-align:center;padding:8px 6px;border-radius:calc(var(--radius-xs)-2px);font-size:.78rem;font-weight:600;cursor:pointer;color:var(--gray-500);transition:all .15s;border:none;background:none}
.idea-tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(var(--primary-rgb),.3)}
.idea-tab:active{transform:scale(.95)}
/* ===== 28. A11Y ===== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div id="app">

<!-- ===== CELEBRATION ===== -->
<div class="celebrate-overlay" id="celebrateOverlay">
  <div class="celebrate-box">
    <div class="stars" id="celebrateStars"></div>
    <h2 id="celebrateTitle"></h2>
    <p id="celebrateText"></p>
    <button class="btn btn-primary btn-sm" onclick="closeCelebration()" style="margin-top:8px">ممتاز! استمر</button>
  </div>
</div>

<!-- ===== MENU SCREEN ===== -->
<div class="screen active" id="menuScreen">
  <div class="scroll-body" style="display:flex;flex-direction:column;align-items:center">
    <div class="logo-wrap">
      <img src="logo.svg" alt="شعار" class="logo-icon">
      <div><div class="logo-text">القاعدة المدنية</div><div class="logo-sub">تعليم القراءة باللمس والصوت</div></div>
    </div>
    <div class="idea-tabs">
      <button class="idea-tab active" id="ideaTab1" onclick="showIdea(1)">فكرة 1: ألعاب</button>
      <button class="idea-tab" id="ideaTab2" onclick="showIdea(2)">فكرة 2: دوالينجو</button>
    </div>
    <div class="theory-row" id="theoryRow">
      <span class="badge badge-primary">مونتيسوري</span>
      <span class="badge badge-success">أورتن-جيلنجهام VAKT</span>
      <span class="badge badge-warning">الوعي الصوتي</span>
      <span class="badge badge-info">ZPD فيجوتسكي</span>
      <span class="badge badge-gold">التعزيز السلوكي</span>
      <span class="badge badge-green">بياجيه</span>
      <span class="badge badge-danger">الإتقان Bloom</span>
      <span class="badge badge-primary">الاسترجاع Ebbinghaus</span>
      <span class="badge badge-success">التشفير المزدوج Paivio</span>
      <span class="badge badge-warning">الاستجابة الحركية Asher</span>
    </div>
    <div id="starDisplay" style="color:var(--gray-500);font-size:.8rem;margin:2px 0"></div>
    <div class="menu-grid" id="menuGrid"></div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center">
      <button class="btn btn-sm btn-ghost" onclick="toggleTheme()" id="themeToggleBtn" style="font-size:.75rem">🌙</button>
      <button class="btn btn-sm btn-ghost" onclick="resetAll()" style="font-size:.7rem;color:var(--gray-400)">🔄 إعادة تعيين</button>
    </div>
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div class="screen" id="gameScreen">
  <div class="header">
    <div class="header-start">
      <button class="header-btn" onclick="exitGame()" aria-label="رجوع">✕</button>
      <span class="header-title" id="gameTitle"></span>
    </div>
    <div class="header-end">
      <span id="gameBadges"></span>
      <button class="theme-btn" onclick="toggleTheme()" id="themeToggleBtn2" aria-label="تبديل الثيم">🌙</button>
    </div>
  </div>
  <div class="scroll-body" id="gameBody" style="display:flex;flex-direction:column;align-items:center"></div>
</div>

</div><!-- /app -->

<script>
/*
===========================================================================
 القاعدة المدنية - HaramApp Visual Identity
===========================================================================
*/
// ===== THEME =====
function toggleTheme(){
  const html=document.documentElement;
  const curr=html.getAttribute('data-theme');
  const next=curr==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  localStorage.setItem('qm_theme',next);
  document.getElementById('themeToggleBtn').textContent=next==='dark'?'☀️':'🌙';
  document.getElementById('themeToggleBtn2').textContent=next==='dark'?'☀️':'🌙';
}
(function(){
  const saved=localStorage.getItem('qm_theme');
  if(saved)document.documentElement.setAttribute('data-theme',saved);
  const curr=document.documentElement.getAttribute('data-theme');
  document.getElementById('themeToggleBtn').textContent=curr==='dark'?'☀️':'🌙';
  document.getElementById('themeToggleBtn2').textContent=curr==='dark'?'☀️':'🌙';
})();

// ===== BOOK DATA =====
let BOOK = [];
const HIJAI = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');

const SHAPES = {

// Student must achieve 80% to advance. Tracks per-letter mastery.
function masteryGame(){
  setH('🎓 الإتقان التام - بلوم','<span class="badge badge-danger">إتقان Bloom - 80%</span>');
  const ls=shuffle(HIJAI);
  let idx=0,total=0,correct=0;

  function percent(l){const m=mastery[l];return m?Math.round(m.correct/(m.total||1)*100):0}

  function r(){
    if(idx>=ls.length){
      const p=correct/(total||1);
      addStar('mastery',p>=.8?3:1);
      celebrate(p>=.8?'🏆🏆🏆':'⭐',Math.round(p*100)+'%',p>=.8?'أتقنت كل الحروف! 🎉':'حاول مرة أخرى');

    }
    const t=ls[idx];
    const opts=shuffle([t].concat(shuffle(HIJAI.filter(x=>x!==t)).slice(0,2)));
    const pct=percent(t);
    const mastered=pct>=80;
    const b=body();
    b.innerHTML=`
      <div class="w-full" style="max-width:420px;text-align:center">
        <div class="flex-between w-full"><span style="color:var(--gray-600);font-size:.75rem">${idx+1}/${ls.length}</span>
          <span style="color:var(--gray-500);font-size:.7rem">${mastered?'✅ متقن':'🔄 قيد التعلم'} ${pct}%</span>
        </div>
        <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${(idx/ls.length)*100}%"></div></div></div>
        <div class="word-box big pop" style="margin:12px auto">${t}</div>
        <div class="flex-center" style="gap:8px;margin:6px 0">
          <span style="font-size:2rem">${LETTER_IMAGES[t]||''}</span>
          <button class="btn btn-sm btn-primary" onclick="say('${t}')">🔊</button>
        </div>
        <p style="color:var(--gray-500);font-size:.75rem">اختر الحرف (يجب 80%+ للانتقال):</p>
        <div class="opt-grid opt-3" style="max-width:260px;margin:8px auto">${opts.map(o=>`<button class="opt-btn" onclick="mC('${t}','${o}',this)">${o}</button>`).join('')}</div>
        <div id="mf" style="min-height:24px;margin:4px 0;font-size:.85rem"></div>
        <div id="mStats" style="color:var(--gray-400);font-size:.7rem;margin:4px 0"></div>
      </div>`;
    window.mC=(target,chosen,btn)=>{
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      total++;mastery[target]=mastery[target]||{correct:0,total:0};mastery[target].total++;
      if(chosen===target){btn.classList.add('correct');correct++;mastery[target].correct++;say(target);document.getElementById('mf').textContent='✅ أحسنت! '+percent(target)+'%'}
      else{btn.classList.add('wrong');document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===target)b.classList.add('correct')});document.getElementById('mf').textContent='❌ '+target+' ('+percent(target)+'%)'}
      save();
      const pct2=percent(target);
      document.getElementById('mStats').textContent=pct2>=80?'✅ متقن! انتقل للتالي':'تحتاج '+(80-pct2)+'% أخرى';
      setTimeout(()=>{idx++;r()},1200);
    };
  }
  r();
}

// ===== SPACED REPETITION (Ebbinghaus) =====
// Review cards at increasing intervals (1d, 3d, 7d, 14d, 30d)
// Simulated: review queue with priority scores
function reviewGame(){
  setH('🔄 المراجعة الذكية - إبنجهاوس','<span class="badge badge-primary">استرجاع متباعد Ebbinghaus</span>');
  let reps=JSON.parse(localStorage.getItem('qm_reps')||'{}');
  function save(){localStorage.setItem('qm_reps',JSON.stringify(reps))}

  // Build priority queue: letters with oldest/lowest review score
  function buildQueue(){
    const now=Date.now();
    return shuffle(HIJAI).sort((a,b)=>{
      const ra=reps[a]||{score:0,time:0};
      const rb=reps[b]||{score:0,time:0};
      return (ra.score/5+ra.time/now)-(rb.score/5+rb.time/now);
    });
  }

  const ls=buildQueue();
  let idx=0,correct=0,total=0;

  function r(){
    if(idx>=ls.length){
      addStar('review',Math.round(correct/(total||1)*3));
      celebrate('🌟🌟🌟','مراجعة ممتازة! 🎉',correct+'/'+total+' صحيحة');
      return;
    }
    const t=ls[idx];
    const opts=shuffle([t].concat(shuffle(HIJAI.filter(x=>x!==t)).slice(0,2)));
    const rep=reps[t]||{score:0,time:0};
    const level=rep.score>=3?'🟢 مألوف':rep.score>=1?'🟡 جديد':'🔴 يحتاج مراجعة';
    const b=body();
    b.innerHTML=`
      <div class="w-full" style="max-width:420px;text-align:center">
        <div class="flex-between w-full"><span style="color:var(--gray-600);font-size:.75rem">${idx+1}/${ls.length}</span><span style="color:var(--gray-500);font-size:.7rem">${level}</span></div>
        <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${(idx/ls.length)*100}%"></div></div></div>
        <div class="word-box big pop" style="margin:12px auto">${t}</div>
        <p style="color:var(--gray-600);font-size:.8rem;margin:4px 0">هل تتذكر هذا الحرف؟</p>
        <div class="opt-grid opt-3" style="max-width:260px;margin:8px auto">${opts.map(o=>`<button class="opt-btn" onclick="rC('${t}','${o}',this)">${o}</button>`).join('')}</div>
        <div id="rf" style="min-height:24px;margin:4px 0;font-size:.85rem;color:var(--body-color)"></div>
      </div>`;
    window.rC=(target,chosen,btn)=>{
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);total++;
      rep.time=Date.now();
      if(chosen===target){
        btn.classList.add('correct');correct++;rep.score=Math.min(rep.score+1,5);
        say(target);document.getElementById('rf').textContent='✅ صحيح! المستوى: '+rep.score+'/5';
      }else{
        btn.classList.add('wrong');rep.score=Math.max(rep.score-1,0);
        document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===target)b.classList.add('correct')});
        document.getElementById('rf').textContent='❌ '+target+' المستوى: '+rep.score+'/5';
      }
      reps[target]=rep;save();addStar('review',1);
      setTimeout(()=>{idx++;r()},1000);
    };
  }
  r();
}

    // Show letter first, then student acts, then verify

    b.innerHTML=`

function traceLetters(){

          <button class="btn btn-sm btn-primary" onclick="nT()">✓ التالي</button>
        </div>
      </div>`;

  }
  function setupTraceCanvas(l){
    const c=document.getElementById('traceCanvas');if(!c)return;
    const cx=c.getContext('2d');drawGuide(cx,l);
    let dr=false,pts=[];
    function gp(e){const r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;if(e.touches)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}}
    function sd(e){e.preventDefault();dr=true;pts=[gp(e)]}

  }
  function drawGuide(cx,l){cx.save();cx.font='bold 160px "uthmanic",system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='rgba(115,103,240,.08)';cx.fillText(l,400,200);cx.restore()}

}

    window.cSh=(target,chosen,btn)=>{document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);if(chosen===target){btn.classList.add('correct');say(target)}else{btn.classList.add('wrong');document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===target)b.classList.add('correct')})}document.getElementById('shn').style.display='inline-flex'};
    window.nSh=()=>{idx++;r()}
  }r()
}

function memoryGame(){
  setH('🧠 الذاكرة','<span class="badge badge-green">بياجيه</span>');
  const cards=shuffle(HIJAI).slice(0,6);let grid=shuffle([...cards,...cards]),flipped=[],matched=[],locked=false;
  function r(){const b=body();let h=`<div class="w-full" style="max-width:380px;text-align:center"><div style="color:var(--gray-600);font-size:.85rem">⭐ ${matched.length/2}/6</div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${(matched.length/12)*100}%"></div></div></div><p style="color:var(--gray-500);font-size:.8rem;margin:4px 0">🧠 أوجد الأزواج</p><div class="opt-grid opt-4" style="max-width:300px;margin:8px auto">`;
    grid.forEach((l,i)=>{if(matched.includes(i))h+=`<div class="opt-btn" style="background:var(--success);color:#fff;border-color:var(--success);font-size:1.4rem">${l}</div>`;else if(flipped.includes(i))h+=`<div class="opt-btn" style="font-size:1.4rem" onclick="mF(${i})">${l}</div>`;else h+=`<div class="opt-btn" style="background:var(--gray-50);color:var(--gray-400);border-color:var(--border-color);font-size:1rem" onclick="mF(${i})">❓</div>`});
    h+=`</div>`;if(matched.length===grid.length){h+=`<p style="color:var(--success);font-size:1.1rem;font-weight:700;margin:6px 0">🎉 اكتملت!</p><button class="btn btn-sm btn-primary" onclick="mR()">إعادة</button>`;addStar('memory',2);setTimeout(()=>celebrate('🌟🌟','أحسنت! 🎉',''),400)}h+=`</div>`;b.innerHTML=h;window.mF=(i)=>{if(locked||flipped.includes(i)||matched.includes(i))return;flipped.push(i);if(flipped.length===2){locked=true;const[a,b]=flipped;if(grid[a]===grid[b]){matched.push(a,b);flipped=[];locked=false;say(grid[a]);r()}else{setTimeout(()=>{flipped=[];locked=false;r()},800)}}r()};window.mR=()=>{matched=[];flipped=[];locked=false;grid=shuffle([...cards,...cards]);r()}}r()
}

// ===== GAME: BROWSE BOOK =====
function browseBook(){
  setH('📄 تصفح الكتاب','<span class="badge badge-gold">قراءة كلية</span>');
  const chs=[];BOOK.forEach((d,i)=>{if(d.is_header&&d.segment.includes('الْبَابُ'))chs.push({name:d.segment.replace(/\n/g,' ').trim(),idx:i})});
  if(!chs.length){body().innerHTML='<p style="color:var(--gray-600);text-align:center">لا توجد بيانات</p>';return}
  let ci=0,pi=0;
  function r(){const ch=chs[ci];const pages=[];let cur=null;for(let i=ch.idx+1;i<BOOK.length;i++){if(BOOK[i].is_header&&BOOK[i].segment.includes('الْبَابُ'))break;if(!BOOK[i].is_header){if(BOOK[i].page!==cur){if(cur!==null)pages.push({page:cur,segs:[]});cur=BOOK[i].page}if(pages.length&&pages[pages.length-1].page==cur)pages[pages.length-1].segs.push(BOOK[i]);else if(cur!==null)pages.push({page:cur,segs:[BOOK[i]]})}}if(!pages.length){body().innerHTML='<p style="color:var(--gray-600);text-align:center">لا توجد صفحات</p>';return}if(pi>=pages.length){addStar('browse',1);celebrate('🌟','👍','تصفحت الأبواب!');return}const pg=pages[pi];const b=body();let h=`<div class="w-full" style="max-width:520px"><div class="nav-bar"><button class="nav-btn" onclick="pN(-1)">→</button><span class="nav-label">${ch.name.substring(0,20)} | ص${pg.page} (${pi+1}/${pages.length})</span><button class="nav-btn" onclick="pN(1)">←</button></div>`;const pdi=pdx(pg.page);if(pdi>=1)h+=`<img src="pages/page_${String(pdi).padStart(2,'0')}.png" class="page-img" loading="lazy" onclick="this.style.maxHeight=this.style.maxHeight==='380px'?'none':'380px'" style="max-height:380px">`;h+=`<div class="card" style="text-align:right;padding:14px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--primary);font-size:.75rem;font-weight:600"><span class="barcode-bar"></span> اضغط للاستماع</div>`;pg.segs.forEach(s=>{const seg=s.segment.trim();h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-color);cursor:pointer" onclick="say('${seg.replace(/'/g,"\\'")}',${s.page},${s.seg_in_book||0})"><span style="font-size:${seg.length>4?'1rem':'1.4rem'};font-weight:700;color:var(--heading-color);font-family:'uthmanic',system-ui">${seg}</span><span style="color:var(--gray-400);font-size:.65rem">🔊</span></div>`});h+=`</div></div>`;b.innerHTML=h;window.pN=(d)=>{pi+=d;if(pi<0){ci=(ci-1+chs.length)%chs.length;pi=0}if(pi>=pages.length){ci=(ci+1)%chs.length;pi=0}r()}}r()
}

// ===== DUOLINGO-STYLE GAME (from book_data) =====
const BAB_COLORS = ['#7367f0','#28c76f','#ff9f43','#ff4c51','#00bad1','#c7a76c','#3c6f5e','#a855f7','#ec4899','#f97316','#14b8a6','#06b6d4','#eab308','#84cc16'];
function babNum(n){const ns=['١','٢','٣','٤','٥','٦','٧','٨','٩','١٠','١١','١٢','١٣','١٤'];return ns[n]||n+1}

function buildDuoUnits(){
  const units=[];
  const babNums=[...new Set(BOOK.filter(x=>x.bab!==null&&x.bab!=='').map(x=>x.bab))].sort((a,b)=>a-b);
  babNums.forEach((bNum,i)=>{
    const ents=BOOK.filter(x=>x.bab===bNum);
    const hdr=ents.find(x=>x.is_header&&x.segment.includes('الْبَابُ'));
    const dNums=[...new Set(ents.filter(x=>x.dars!==null&&x.dars!=='').map(x=>x.dars))].sort((a,b)=>a-b);
    const lessons=[];
    dNums.forEach(dn=>{
      const de=ents.filter(x=>x.dars===dn&&!x.is_header);
      const segs=de.map(x=>x.segment.trim()).filter(s=>s);
      if(segs.length){
        const dh=ents.find(x=>x.is_header&&x.dars===dn&&x.segment.includes('الدَّرْسُ'));
        lessons.push({name:dh?dh.segment.replace(/\n/g,' ').trim():`الدرس`,segs});
      }
    });
    if(lessons.length){
      const nm=hdr?hdr.segment.replace(/\n/g,' ').trim().substring(0,35):`الباب ${bNum}`;
      units.push({id:'bab_'+bNum,name:nm,color:BAB_COLORS[i%BAB_COLORS.length],lessons,bab:bNum});
    }
  });
  return units;
}

function duolingoGame(){
  let animating=false;
  let DUO_UNITS=buildDuoUnits();

  function loadD(){try{return JSON.parse(localStorage.getItem('qm_duo')||'{}')}catch(e){return{}}}
  function saveD(d){localStorage.setItem('qm_duo',JSON.stringify(d))}
  function getHearts(d){const hr=d.heartsTime?Math.floor((Date.now()-d.heartsTime)/1800000):0;return Math.min(5,(d.hearts||5)+hr)}
  function unitProgress(d,uid){const u=d[uid];return u?Math.min(u,DUO_UNITS.find(x=>x.id===uid)?.lessons?.length||99):0}
  function completeLesson(d,uid,lessonCount){d[uid]=(d[uid]||0)+1;if(d[uid]>lessonCount)d[uid]=lessonCount;saveD(d)}

  function genQ(seg,allSegs){
    const segs=[seg];
    const pool=allSegs.filter(s=>s!==seg&&s.length===seg.length);
    const extras=shuffle(pool.length?pool:allSegs.filter(s=>s!==seg)).slice(0,2);
    while(extras.length<2&&allSegs.length>1){const r=allSegs[Math.floor(Math.random()*allSegs.length)];if(r!==seg&&!extras.includes(r))extras.push(r)}
    const opts=shuffle([seg,...extras]);
    const display=seg.length>20?seg.substring(0,20)+'...':seg;
    return {html:`<div style="font-size:1.8rem;margin:6px 0;font-family:'uthmanic',system-ui;color:var(--heading-color);line-height:1.6">${display}</div>
      <button class="btn btn-sm btn-primary" onclick="say('${seg.replace(/'/g,"\\'")}')" style="margin:4px 0">🔊 استمع</button>
      <p style="color:var(--gray-500);font-size:.75rem;margin:6px 0">اختر ما سمعت:</p>
      <div class="opt-grid opt-2" style="max-width:280px;margin:6px auto">${opts.map(o=>`<button class="opt-btn duo-btn" data-val="${o.replace(/'/g,"\\'")}">${o.length>12?o.substring(0,12)+'...':o}</button>`).join('')}</div>`, answer:seg};
  }

  function genFirstLetterQ(seg,allSegs){
    const first=seg.replace(/[ًٌٍَُِّْ]|ـ/g,'').trim()[0]||seg[0];
    if(!first||!HIJAI.includes(first))return null;
    const opts=shuffle(HIJAI.filter(x=>x!==first)).slice(0,2);
    const all=shuffle([first,...opts]);
    const display=seg.length>20?seg.substring(0,20)+'...':seg;
    return {html:`<div style="font-size:1.6rem;margin:4px 0;font-family:'uthmanic',system-ui;color:var(--heading-color)">${display}</div>
      <button class="btn btn-sm btn-primary" onclick="say('${seg.replace(/'/g,"\\'")}')">🔊</button>
      <p style="color:var(--gray-500);font-size:.75rem;margin:6px 0">أي حرف أول؟</p>
      <div class="opt-grid opt-3" style="max-width:200px;margin:6px auto">${all.map(o=>`<button class="opt-btn duo-btn" data-val="${o}">${o}</button>`).join('')}</div>`, answer:first};
  }

  function showUnitSelect(prog){
    DUO_UNITS=buildDuoUnits(); // rebuild in case book data changed
    const d=loadD();
    let h=`<div class="w-full" style="max-width:420px"><div style="display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:6px"><span style="color:var(--primary);font-weight:700">❤️ ${getHearts(d)}</span><span style="color:var(--gold)">⭐ ${d.xp||0} XP</span></div>
      <div style="display:flex;align-items:center;gap:4px"><span style="color:var(--warning)">🔥 ${d.streak||0}</span>
        <button class="btn btn-sm btn-ghost" onclick="duoReset()" style="font-size:.65rem;color:var(--gray-400)">🔄</button></div>
    </div>
    <p style="font-size:.85rem;font-weight:700;color:var(--heading-color);margin:6px 0;text-align:center">🦉 القاعدة المدنية</p>`;
    DUO_UNITS.forEach((u,i)=>{
      const done=unitProgress(d,u.id);
      const prevDone=i===0||unitProgress(d,DUO_UNITS[i-1].id)>=1;
      const locked=!prevDone;
      const pct=u.lessons.length?done/u.lessons.length*100:0;
      h+=`<div class="card" style="padding:8px 10px;margin:3px 0;border-right:3px solid ${u.color};opacity:${locked?.35:1};cursor:${locked?'not-allowed':'pointer'}" onclick="${locked?'':`duoShowLessons('${u.id}')`}">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:${u.color}15;color:${u.color};font-size:.8rem;font-weight:800">${babNum(i)}</span>
          <div style="flex:1;overflow:hidden"><div style="font-weight:700;font-size:.8rem;color:var(--heading-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.name}</div>
          <div style="font-size:.6rem;color:var(--gray-400)">${done}/${u.lessons.length} دروس</div></div>
          <div class="progress-wrap" style="width:40px"><div class="progress-track"><div class="progress-fill" style="width:${Math.min(pct,100)}%"></div></div></div>
        </div>
      </div>`;
    });
    h+=`<p style="text-align:center;color:var(--gray-400);font-size:.6rem;margin:6px 0">${d.xp?'⭐ XP: '+d.xp+' | ':''}${d.streak?'🔥 '+d.streak+' يوم':'ابدأ رحلتك'}</p>`;
    body().innerHTML=h;
  }

  window.duoReset=()=>{localStorage.removeItem('qm_duo');showUnitSelect()};
  window.duoShowLessons=(uid)=>{
    DUO_UNITS=buildDuoUnits();
    const u=DUO_UNITS.find(x=>x.id===uid);
    if(!u)return;
    const d=loadD();
    const done=unitProgress(d,uid);
    const ui=DUO_UNITS.indexOf(u);
    let h=`<div class="w-full" style="max-width:420px"><div style="display:flex;align-items:center;gap:6px;padding:4px 0">
      <button class="btn btn-sm btn-ghost" onclick="showUnitSelect()" style="font-size:.8rem">←</button>
      <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:${u.color}15;color:${u.color};font-size:.8rem;font-weight:800;margin-left:4px">${babNum(ui)}</span>
      <span style="font-size:.85rem;font-weight:700;color:var(--heading-color)">${u.name}</span>
    </div>`;
    u.lessons.forEach((ls,i)=>{
      const completed=i<done;
      h+=`<div class="card" style="padding:8px 10px;margin:3px 0;cursor:pointer;opacity:${completed?.6:1};background:${completed?'var(--success)10':''}" onclick="${!completed||true?`duoStartLesson('${uid}',${i})`:''}">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:1.1rem;color:${completed?'var(--success)':'var(--gray-400)'}">${completed?'✅':'📘'}</span>
          <div style="flex:1;font-size:.75rem;color:var(--heading-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ls.name.replace(/^الدَّرْسُ\s*/,'')}</div>
          <span style="font-size:.6rem;color:var(--gray-400)">${ls.segs.length}</span>
        </div>
      </div>`;
    });
    h+=`</div>`;body().innerHTML=h;
  };

  window.duoStartLesson=(uid,lIdx)=>{
    if(animating)return;
    DUO_UNITS=buildDuoUnits();
    const u=DUO_UNITS.find(x=>x.id===uid);
    if(!u||!u.lessons[lIdx])return;
    const d=loadD();
    if(getHearts(d)<1){body().innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:3rem">❤️</div><p style="color:var(--gray-600);margin:8px 0">لا توجد قلوب!</p><button class="btn btn-sm btn-primary" onclick="duoShowLessons('${uid}')">← رجوع</button></div>`;return}
    const lesson=u.lessons[lIdx];
    const pool=shuffle(lesson.segs.filter(s=>s.trim()));
    if(!pool.length){celebrate('⭐','لا توجد مقاطع في هذا الدرس','');return}
    const qCount=Math.min(5,pool.length);
    let qIdx=0,correctCount=0,lessonHearts=getHearts(d),combo=0;
    const questions=pool.slice(0,qCount).map(seg=>{
      // 40% chance first-letter question for 2+ char segs, else listen
      if(seg.length>=2&&Math.random()<.4){const q=genFirstLetterQ(seg,pool);if(q)return q}
      return genQ(seg,pool);
    });

    function renderQ(){
      if(lessonHearts<=0){d.hearts=0;saveD(d);body().innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:3rem">💔</div><p style="color:var(--gray-600);margin:8px 0">انتهت القلوب!</p><button class="btn btn-sm btn-primary" onclick="showUnitSelect()">← رجوع</button></div>`;return}
      if(qIdx>=qCount){
        const passed=correctCount>=3;
        if(passed){
          const bonus=Math.min(combo,5)*5;
          d.xp=(d.xp||0)+10*qCount+bonus;
          d.hearts=lessonHearts;
          completeLesson(d,uid,u.lessons.length);
          const today=new Date().toDateString();
          if(d.lastDate&&d.lastDate!==today){const diff=(new Date(today)-new Date(d.lastDate))/86400000;d.streak=(d.streak||0)+(diff<=1.5?1:1)}
          else if(!d.lastDate)d.streak=(d.streak||0)+1;
          d.lastDate=today;saveD(d);
          celebrate('🏆🏆🏆','أحسنت! 🎉',`${correctCount}/${qCount} | +${10*qCount+bonus} XP | 🔥 ${d.streak}`);
        }else{celebrate('⭐','حاول مرة أخرى','')}
        setTimeout(()=>showUnitSelect(),1200);return;
      }
      const q=questions[qIdx];
      const b=body();
      b.innerHTML=`<div class="w-full" style="max-width:420px"><div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
        <div>${Array(Math.min(lessonHearts,5)).fill().map(()=>'<span style="color:var(--danger);font-size:1.1rem">❤️</span>').join('')}${lessonHearts<5?Array(5-Math.min(lessonHearts,5)).fill().map(()=>'<span style="color:var(--gray-300);font-size:1.1rem">❤️</span>').join(''):''}</div>
        <div style="font-size:.7rem;color:var(--gray-500)">${lIdx+1}/${u.lessons.length}</div>
      </div>
      <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${(qIdx/qCount)*100}%"></div></div></div>
      ${q.html}
      <div id="duoResult" style="min-height:36px;margin:4px 0;text-align:center;font-size:.85rem;font-weight:700"></div></div>`;
      b.querySelectorAll('.duo-btn').forEach(btn=>{btn.onclick=()=>{
        if(animating)return;animating=true;
        const chosen=btn.getAttribute('data-val');const correct=q.answer;
        const rd=document.getElementById('duoResult');
        b.querySelectorAll('.duo-btn').forEach(b2=>b2.disabled=true);
        if(chosen===correct){correctCount++;combo++;btn.classList.add('correct');rd.innerHTML=`<span style="color:var(--success);font-size:1.2rem">✅ ${combo>1?'🔥 x'+combo:''}</span>`;say(correct)}
        else{combo=0;lessonHearts--;btn.classList.add('wrong');b.querySelectorAll('.duo-btn').forEach(b2=>{if(b2.getAttribute('data-val')===correct)b2.classList.add('correct')});rd.innerHTML=`<span style="color:var(--danger);font-size:1.2rem">❌</span>`}
        animating=false;setTimeout(renderQ,800);
      }});
    }
    renderQ();
  }

  setH('🦉 دوالينجو القاعدة المدنية','<span class="badge badge-primary">من الكتاب</span>');
  showUnitSelect();
}
